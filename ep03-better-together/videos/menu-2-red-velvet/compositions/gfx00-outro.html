<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; 
  --cream: #FFF3DF; --tomato: #E8402A; --mustard: #FFB81C; --cocoa: #2A1810;
  --leaf: #2F9E5B; --ink: #1B0F09; --white: #FFFFFF;
 font-family: Montserrat, 'Archivo Black', sans-serif; }
        
        .bg { position: absolute; inset: 0; background: var(--tomato); }
        .dots { position: absolute; inset: -40px; background-image: radial-gradient(var(--cocoa) 3px, transparent 3.5px);
                 background-size: 46px 46px; opacity: 0.18; }
        .stripe { position: absolute; left: -10%; width: 120%; height: 499px; top: 710px; background: var(--mustard);
                   border-top: 10px solid var(--cocoa); border-bottom: 10px solid var(--cocoa); transform-origin: 50% 50%; }
        .wrap { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .l1 { font-family: 'Archivo Black', sans-serif; font-size: 150px; line-height: 0.9; color: var(--cream);
               -webkit-text-stroke: 16px var(--cocoa); paint-order: stroke fill; text-shadow: 0 16px 0 var(--cocoa); letter-spacing: -0.02em; width: 960px; }
        .l2 { margin-top: 40px; font-weight: 900; font-size: 44px; color: var(--cream); text-shadow: 0 4px 0 var(--cocoa); }
        .l3 { margin-top: 28px; display: inline-block; font-weight: 900; font-size: 44px; letter-spacing: 0.12em; color: var(--cream);
               background: var(--cocoa); padding: 14px 34px; border-radius: 999px; }
      </style>
      <div id="root" data-composition-id="gfx00-outro" data-width="1080" data-height="1920">
        <div class="bg"></div><div class="dots"></div><div class="stripe" data-layout-allow-overflow></div>
        <div class="wrap"><div class="l1">RED VELVET</div><div class="l2">Thermomix adun × Cooven bakar</div><div><span class="l3">FOLLOW + SHARE</span></div></div>
      </div>
      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          const q = (s) => document.querySelector('[data-composition-id="gfx00-outro"] ' + s);
          q('.bg') && tl.fromTo(q('.bg'), { scale: 1.4 }, { scale: 1, duration: 0.5, ease: 'power3.out' }, 0);
          q('.stripe') && tl.fromTo(q('.stripe'), { scaleX: 0, rotation: -6 }, { scaleX: 1, rotation: -6, duration: 0.5, ease: 'power4.out' }, 0.1);
          q('.l1') && tl.fromTo(q('.l1'), { scale: 2.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: 'back.out(1.6)' }, 0.25);
          q('.l2') && tl.fromTo(q('.l2'), { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35 }, 0.6);
          q('.l3') && tl.fromTo(q('.l3'), { scale: 0 }, { scale: 1, duration: 0.35, ease: 'back.out(3)' }, 0.85);
          q('.dots') && tl.to(q('.dots'), { x: 46, y: 46, duration: 2.5, ease: 'none' }, 0);
          window.__timelines["gfx00-outro"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
