<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; 
  --cream: #FFF3DF; --tomato: #E8402A; --mustard: #FFB81C; --cocoa: #2A1810;
  --leaf: #2F9E5B; --ink: #1B0F09; --white: #FFFFFF;
 font-family: Montserrat, 'Archivo Black', sans-serif; }
        
        .hook { position: absolute; left: 790px; width: 980px; top: 230px; text-align: center; }
        .kick { display: inline-block; background: var(--tomato); color: var(--cream); font-weight: 900; font-size: 34px;
                 letter-spacing: 0.08em; padding: 12px 28px; border-radius: 999px; margin-bottom: 26px; text-transform: uppercase; }
        .htext { font-family: 'Archivo Black', sans-serif; font-size: 84px; line-height: 1.02; color: var(--white);
                 letter-spacing: -0.02em; text-transform: uppercase; -webkit-text-stroke: 10px var(--cocoa); paint-order: stroke fill;
                 text-shadow: 0 10px 0 var(--cocoa); }
        .hw { display: inline-block; margin: 0 0.12em; }
        .hl { color: var(--mustard); }
      </style>
      <div id="root" data-composition-id="ov02-hook" data-width="1920" data-height="1080">
        <div class="hook">
          
          <div class="htext"><span class="hw">SENDIRI:</span><span class="hw">&lt;</span><span class="hw">RM20!</span></div>
        </div>
      </div>
      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          const q = (s) => document.querySelector('[data-composition-id="ov02-hook"] ' + s);
          q('.kick') && tl.fromTo(q('.kick'), { scale: 0.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: 'back.out(2.5)' }, 0);
          q('.htext') && tl.fromTo(q('.htext').children, { y: 60, scale: 1.6, opacity: 0 }, { y: 0, scale: 1, opacity: 1, duration: 0.28, ease: 'back.out(2)', stagger: 0.07 }, 0.1);
          q('.hook') && tl.to(q('.hook'), { opacity: 0, y: -40, duration: 0.3, ease: 'power2.in' }, 2.9499999999999997);
          window.__timelines["ov02-hook"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
