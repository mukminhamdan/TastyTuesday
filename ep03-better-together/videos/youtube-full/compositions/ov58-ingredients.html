<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; 
  --cream: #FFF3DF; --tomato: #E8402A; --mustard: #FFB81C; --cocoa: #2A1810;
  --leaf: #2F9E5B; --ink: #1B0F09; --white: #FFFFFF;
 font-family: Montserrat, 'Archivo Black', sans-serif; }
        
        .ing { position: absolute; left: 780px; width: 1000px; top: 200px; background: var(--cream); border: 6px solid var(--cocoa);
                border-radius: 34px; box-shadow: 0 14px 0 var(--cocoa); padding: 30px 44px 34px; }
        .ih { font-family: 'Archivo Black', sans-serif; font-size: 46px; color: var(--tomato); margin-bottom: 14px; text-transform: uppercase; }
        .it { display: flex; align-items: center; font-weight: 800; font-size: 34px; color: var(--ink); line-height: 1.25; margin: 8px 0; }
        .ck { flex: 0 0 auto; width: 34px; height: 34px; border-radius: 10px; background: var(--leaf); margin-right: 20px; border: 4px solid var(--cocoa); }
      </style>
      <div id="root" data-composition-id="ov58-ingredients" data-width="1920" data-height="1080">
        <div class="ing">
          <div class="ih">Sos curah siakap</div>
          <div class="it"><span class="ck"></span><span>Bawang putih</span></div><div class="it"><span class="ck"></span><span>Chicken stock</span></div><div class="it"><span class="ck"></span><span>Lada</span></div><div class="it"><span class="ck"></span><span>Daun ketumbar</span></div><div class="it"><span class="ck"></span><span>Sos ikan</span></div><div class="it"><span class="ck"></span><span>Limau nipis</span></div>
        </div>
      </div>
      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          const q = (s) => document.querySelector('[data-composition-id="ov58-ingredients"] ' + s);
          q('.ing') && tl.fromTo(q('.ing'), { y: -1080, rotation: 3 }, { y: 0, rotation: 0, duration: 0.5, ease: 'back.out(1.2)' }, 0);
          q('.ing') && tl.fromTo(q('.ing').querySelectorAll('.it'), { x: -60, opacity: 0 }, { x: 0, opacity: 1, duration: 0.25, stagger: 0.3333333333333333 }, 0.45);
          q('.ing') && tl.fromTo(q('.ing').querySelectorAll('.ck'), { scale: 0 }, { scale: 1, duration: 0.2, ease: 'back.out(3)', stagger: 0.3333333333333333 }, 0.6);
          q('.ing') && tl.to(q('.ing'), { y: 1080, duration: 0.45, ease: 'power3.in' }, 7.55);
          window.__timelines["ov58-ingredients"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
