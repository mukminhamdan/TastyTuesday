<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; 
  --cream: #FFF3DF; --tomato: #E8402A; --mustard: #FFB81C; --cocoa: #2A1810;
  --leaf: #2F9E5B; --ink: #1B0F09; --white: #FFFFFF;
 font-family: Montserrat, 'Archivo Black', sans-serif; }
        
        .card { position: absolute; left: 780px; width: 1000px; top: 220px; background: var(--cream); border-radius: 34px;
                 border: 6px solid var(--cocoa); box-shadow: 0 14px 0 var(--cocoa); padding: 34px 40px 36px 150px; }
        .icon { position: absolute; left: 26px; top: 28px; width: 100px; height: 100px; }
        .ttl { display: inline-block; font-weight: 900; font-size: 28px; letter-spacing: 0.1em; text-transform: uppercase;
                color: var(--cream); background: var(--tomato); padding: 8px 18px; border-radius: 999px; margin-bottom: 14px; }
        .txt { font-weight: 800; font-size: 44px; line-height: 1.16; color: var(--ink); letter-spacing: -0.01em; }
        .txt b { color: var(--tomato); font-weight: 900; }
      </style>
      <div id="root" data-composition-id="ov05-tip" data-width="1920" data-height="1080">
        <div class="card">
          <div class="icon"><svg viewBox="0 0 64 64" width="100%" height="100%"><circle cx="32" cy="26" r="16" fill="#FFB81C"/><rect x="24" y="40" width="16" height="10" rx="3" fill="#2A1810"/><rect x="27" y="52" width="10" height="5" rx="2" fill="#2A1810"/><path d="M26 26 q6 -8 12 0" stroke="#FFF3DF" stroke-width="3" fill="none" stroke-linecap="round"/></svg></div>
          <div class="ttl">PES DAH GARING?</div>
          <div class="txt">Tengok — dah masak bila <b>berbiji, tak bergumpal</b>.</div>
        </div>
      </div>
      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          const q = (s) => document.querySelector('[data-composition-id="ov05-tip"] ' + s);
          q('.card') && tl.fromTo(q('.card'), { x: -1920, rotation: -4 }, { x: 0, rotation: 0, duration: 0.5, ease: 'back.out(1.4)' }, 0);
          q('.icon') && tl.fromTo(q('.icon'), { scale: 0, rotation: -90 }, { scale: 1, rotation: 0, duration: 0.4, ease: 'back.out(3)' }, 0.3);
          q('.txt') && tl.fromTo(q('.txt'), { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.3 }, 0.4);
          q('.icon') && tl.to(q('.icon'), { rotation: 8, duration: 0.5, yoyo: true, repeat: 9, ease: 'sine.inOut' }, 0.8);
          q('.card') && tl.to(q('.card'), { x: 1920, duration: 0.4, ease: 'power3.in' }, 5.55);
          window.__timelines["ov05-tip"] = tl;
        })();
      </script>
    </template>
